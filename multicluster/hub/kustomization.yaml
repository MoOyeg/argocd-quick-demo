apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# App-of-apps content for the OpenShift hub.
#
# Reuses ../../apps rather than duplicating the Application manifests - only
# the selection differs. The hub runs the Vault platform plus payments-api;
# inventory-web lives on the EKS spoke (../eks).
namespace: openshift-gitops

resources:
  - ../../apps

patches:
  # Remove inventory-web from this cluster's set.
  - patch: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: inventory-web
        namespace: openshift-gitops
      $patch: delete

labels:
  - includeSelectors: false
    pairs:
      demo.redhat.com/cluster: hub
