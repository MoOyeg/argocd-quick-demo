apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inventory-demo

# The point of this overlay: the SAME base runs on a non-OpenShift cluster.
# The only structural difference is how it gets exposed - which is exactly why
# the base stops at a ClusterIP Service (see manifests/inventory-web/base/
# service.yaml). OpenShift gets a Route in overlays/demo; here the Service is
# promoted to type: LoadBalancer.
#
# Requires an ingress controller in the cluster. OpenShift ships one; a plain
# EKS cluster does not, so install one first (see the README). Get the URL:
#   kubectl -n inventory-demo get ingress inventory-web \
#     -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
resources:
  - ../../base
  - ingress.yaml

configMapGenerator:
  - name: inventory-web-env
    behavior: merge
    literals:
      - APP_ENV=eks
      - LOG_LEVEL=debug
      - INVENTORY_PAGE_SIZE=50
      - INVENTORY_WAREHOUSE_REGION=us-east-2
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"

  - name: inventory-web-ui
    behavior: replace
    files:
      - config/ui.properties
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"

patches:
  - path: patch.yaml

replicas:
  - name: inventory-web
    count: 1

images:
  - name: registry.access.redhat.com/ubi9/python-311
    newTag: 1-1762197673
    digest: sha256:d0b35f779ca0ae87deaf17cd1923461904f52d3ef249a53dbd487e02bdabdde6

labels:
  - includeSelectors: false
    pairs:
      demo.redhat.com/overlay: eks
