# Overlay copy of ui.properties, pulled in with behavior: replace.
# Because it replaces rather than merges, this file is the whole ConfigMap -
# nothing from base/config/ui.properties survives.
ui.theme=eks-dark
ui.items.per.page=50
ui.refresh.interval.seconds=10
ui.show.stock.warnings=true
ui.show.demo.banner=true
ui.date.format=yyyy-MM-dd HH:mm
ui.locale=en-US
