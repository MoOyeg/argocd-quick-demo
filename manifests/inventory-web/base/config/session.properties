# key=value properties -> secretGenerator (files:) -> a Secret holding the file
# under the key "session.properties", mounted at /opt/app/secrets/.
#
# This is the file-oriented secretGenerator idiom (payments-api shows the
# env-oriented one). Same caveat applies: base64 is not encryption, this is
# plaintext in git, so keep real credentials in Vault.
session.cookie.name=INVENTORYSESSION
session.timeout.minutes=30
session.same.site=Strict
session.demo.signing.hint=demo-value-not-a-real-secret
