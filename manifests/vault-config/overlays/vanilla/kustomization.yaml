apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Vanilla-Kubernetes flavour of the Vault seed job.
#
# Same reason as manifests/vault/overlays/vanilla: the hashicorp/vault image
# declares no USER, so runAsNonRoot: true with no runAsUser fails the kubelet's
# check with "container has runAsNonRoot and image will run as root".
resources:
  - ../../base

patches:
  - path: runasuser-patch.yaml
    target:
      group: batch
      version: v1
      kind: Job
      name: vault-seed
