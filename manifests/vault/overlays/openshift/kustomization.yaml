apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenShift flavour of the Vault platform.
#
# Nothing to add: the base sets runAsNonRoot: true but no runAsUser, and the
# restricted-v2 SCC assigns each pod a UID from the namespace's allocated
# range. That is exactly what you want on OpenShift - hardcoding a UID here
# would be REJECTED, because restricted-v2 uses MustRunAsRange and 100 is not
# in the namespace range.
#
# See ../vanilla for the same workload on a cluster with no SCC.
resources:
  - ../../base
