---
# WAVE 1: the Vault server itself.
#
# DEV MODE - in-memory storage, auto-unsealed, root token "root", plain HTTP.
# Everything is wiped when the pod restarts. This is deliberate: it keeps the
# demo to a single `oc apply` with no unseal ceremony. Do not copy this shape
# into anything real.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:1.21.4
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: root
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            # The image entrypoint tries to chown/setcap when it runs as root.
            # Under OpenShift's restricted-v2 SCC we get an arbitrary UID, so
            # skip both rather than let the entrypoint fail.
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            - name: HOME
              value: /home/vault
          ports:
            - name: http
              containerPort: 8200
          volumeMounts:
            - name: home
              mountPath: /home/vault
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        # Dev mode writes ~/.vault-token; the image filesystem is read-only to
        # an arbitrary UID, so give HOME a writable emptyDir.
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: vault
spec:
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8200
      targetPort: 8200
