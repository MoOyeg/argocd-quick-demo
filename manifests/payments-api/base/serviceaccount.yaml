---
# WAVE 0 - the identity. This name is not cosmetic: the Vault role
# auth/kubernetes/role/payments-api is bound to exactly
# ServiceAccount "payments-api" in namespace "payments-demo".
# Rename this and Vault login fails with "permission denied".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
