# key=value properties -> kustomize configMapGenerator (files:) -> a real file
# mounted at /opt/app/config/logging.properties.
#
# Use files: when the application wants to read a properties file itself;
# use envs: when it wants environment variables. Same source format, two very
# different consumption models - this app demonstrates both.
handlers=java.util.logging.ConsoleHandler
.level=INFO
com.example.payments.level=DEBUG
com.example.payments.ledger.level=TRACE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s %2$s - %5$s%6$s%n
