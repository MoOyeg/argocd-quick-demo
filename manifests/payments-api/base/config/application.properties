# key=value properties -> kustomize configMapGenerator (envs:) -> env vars.
# Every line here becomes one key in the ConfigMap and one env var in the Pod.
# Overlays override individual keys without copying this file.
APP_NAME=payments-api
APP_ENV=base
APP_VERSION=1.4.0
LOG_LEVEL=info
SERVER_PORT=8080
PAYMENTS_CURRENCY=USD
PAYMENTS_MAX_AMOUNT=1000
PAYMENTS_RETRY_ATTEMPTS=3
PAYMENTS_SETTLEMENT_WINDOW=24h
