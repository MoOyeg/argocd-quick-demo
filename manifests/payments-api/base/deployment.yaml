---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-demo
  annotations:
    # WAVE 2 - after the ConfigMaps and Secret (wave 1) exist.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
      annotations:
        # ---- VAULT AGENT INJECTION -------------------------------------
        # The injector webhook reads these and rewrites the Pod to add a
        # vault-agent-init container and a vault-agent sidecar.
        vault.hashicorp.com/agent-inject: "true"
        # Which Vault role to log in as. Must match the role created by the
        # seed Job, and the SA below must be in its bound list.
        vault.hashicorp.com/role: "payments-api"
        # REQUIRED ON OPENSHIFT: by default the agent pins itself to UID 100,
        # which restricted-v2 rejects. Setting this to false lets OpenShift
        # assign the injected containers a UID from the namespace range.
        vault.hashicorp.com/agent-set-security-context: "false"
        # Fetch secrets before the app container starts (default, made explicit).
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-status: "update"
        # Render secret/payments-api/database into
        # /vault/secrets/database.properties as key=value properties - the same
        # shape the app already reads its ConfigMap in.
        vault.hashicorp.com/agent-inject-secret-database.properties: "secret/data/payments-api/database"
        vault.hashicorp.com/agent-inject-template-database.properties: |
          {{- with secret "secret/data/payments-api/database" -}}
          db.username={{ .Data.data.username }}
          db.password={{ .Data.data.password }}
          db.url={{ .Data.data.url }}
          {{- end }}
    spec:
      serviceAccountName: payments-api
      containers:
        - name: app
          image: registry.access.redhat.com/ubi9/python-311:1-1762197673
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              WWW=/tmp/www
              mkdir -p "$WWW"
              {
                echo "<html><head><title>${APP_NAME}</title>"
                echo "<style>body{font-family:monospace;margin:2rem;max-width:60rem}"
                echo "pre{background:#f4f4f4;padding:1rem;overflow-x:auto}h2{margin-top:2rem}</style>"
                echo "</head><body>"
                echo "<h1>${APP_NAME} v${APP_VERSION} &mdash; env: ${APP_ENV}</h1>"

                echo "<h2>1. ConfigMap as env vars (configMapGenerator envs:)</h2><pre>"
                # Exclude the *_SERVICE_*/*_PORT* vars the kubelet injects
                # for every Service - they are not from our ConfigMap and
                # showing them here would misrepresent what kustomize made.
                env | grep -E '^(APP_|LOG_|SERVER_|PAYMENTS_)' \
                  | grep -vE '_SERVICE_|_PORT|^APP_ROOT=' | sort || true
                echo "</pre>"

                echo "<h2>2. Secret as env vars (secretGenerator envs:)</h2><pre>"
                echo "BOOTSTRAP_CLIENT_ID=${BOOTSTRAP_CLIENT_ID:-<unset>}"
                echo "TELEMETRY_TOKEN=<redacted, but it is plaintext in git>"
                echo "</pre>"

                echo "<h2>3. ConfigMap as a mounted file (configMapGenerator files:)</h2><pre>"
                cat /opt/app/config/logging.properties 2>/dev/null || echo "not mounted"
                echo "</pre>"

                echo "<h2>4. Vault-injected secret (/vault/secrets/database.properties)</h2><pre>"
                if [ -f /vault/secrets/database.properties ]; then
                  sed -E 's/^(db\.password=).*/\1********/' /vault/secrets/database.properties
                  echo ""
                  echo "# ^ rendered at runtime by the Vault agent sidecar."
                  echo "# never stored in git, never a Kubernetes Secret."
                else
                  echo "NOT INJECTED"
                  echo "check that the vault-agent-injector pod is running and that"
                  echo "the vault-seed job created the payments-api role."
                fi
                echo "</pre></body></html>"
              } > "$WWW/index.html"
              cd "$WWW"
              exec python3 -m http.server "${SERVER_PORT}"
          envFrom:
            # Kustomize rewrites both names to their hashed equivalents.
            - configMapRef:
                name: payments-api-env
            - secretRef:
                name: payments-api-bootstrap
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: app-config
              mountPath: /opt/app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-config
          configMap:
            name: payments-api-props
